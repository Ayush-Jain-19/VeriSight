[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-deepfake-detection"
version = "0.1.0"
description = "Multimodal deepfake detection using audio-visual fusion and calibrated abstention"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Multimodal Deepfake Detection Research Contributors" }
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "langdetect>=1.0.9",
    "rapidfuzz>=3.0",
    "onnxruntime>=1.18",
    "timm>=0.9.12",
    "transformers>=4.48.0,<5.0.0",
    "opencv-python-headless>=4.8.0",
    "soundfile>=0.12.1",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
faces = ["facenet-pytorch>=2.6.0"]
asr = ["faster-whisper>=1.1,<2"]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
